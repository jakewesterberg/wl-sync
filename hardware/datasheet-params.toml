note = """Confirms M5's clamp analysis. Digital inputs behind 100 ohm draw 186 mA on a
+/-24 V mis-plug -- inside the 200 mA average rating. Analog inputs behind 1 kohm draw
35.6 mA on +/-48 V. Both survive.

What the rating does NOT cover is the unpowered case: with the board off, a 12 V fault
charges the dead +5 V rail through the clamp toward 11.6 V, past the AHCT541's 7 V VCC
absolute maximum. The diode survives; the logic does not."""
