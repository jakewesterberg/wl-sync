ground_terminal = "steel, tin plated"
tray_qty = 40
feeds = ["F6"]
note = """Isolation is structural: the body is glass-filled PBT, so each shell is inherently
isolated from the panel and from its neighbour. That is what the deferred bulkhead-bonding
scheme requires, and it cannot wear off the way a coating could.

The PCB pattern (4 x 0.89 mm signal, 2 x 2.01 mm ground) matches the Winchester 364 family
convention and KiCad's BNC_Win_364A2x95_Horizontal footprint, so a validated geometry exists
even though the Amphenol-specific KiCad footprint is self-contradictory and must not be used.

16 mm port pitch means two rows of duals fit within a 2U face (58 mm of 82 mm usable),
halving the horizontal span versus one row. At 16 mm centres adjacent mating plugs nearly
touch -- normal for stacked duals, but plugs mate one at a time.

Replaces BNC_PanelMountable_Vertical, whose axis is perpendicular to the board (F6)."""

