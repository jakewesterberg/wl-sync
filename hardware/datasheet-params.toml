feeds = ["F5"]
note = """F5's actual fix: replaces the LD1117S50 as the source of ISO_5V, moving that
whole 63-91 mA digital branch OFF ISO_P12 (which it was overloading to 114-162% of the
IH1215D's 66 mA per-rail rating) and onto +5V through a galvanic barrier.

CHOSEN OVER THE AUDIT'S NAMED TMA-0505S BECAUSE IT IS REGULATED. +/-1% set accuracy and
0.5% load regulation keep ISO_5V at 5.0 V, so the ACSL-6xx0's 5.5 V VDD absolute maximum
keeps real headroom and finding F1's 301 ohm ISO_5V resistors -- sized against a +/-2%
rail -- remain valid. It also improves isolation (1500 VDC vs 1000), needs no minimum
load, and is more efficient (76% vs 71%). Cost: one new part number.

PINOUT VERIFIED pin-by-pin against the datasheet's own Pinout table (p.4), not assumed
from the KiCad symbol -- they agree.

IT IS A SWITCHER, AND THAT IS THE REAL TRADE. Spec Sec.8 rejects on-board switchers and
permits exactly one (the IH1215D); this is a second. Two mitigations and one residual:
the rail it creates powers ONLY optocoupler output stages, never analog, and the
Intan-domain INA105s keep their ferrite pi filter and both low-noise LDOs -- indeed they
stop sharing a rail with a 57+ mA digital branch, which is a noise IMPROVEMENT. Its
primary sits on +5V/DGND (the digital ground, already switching 30 optocoupler LEDs),
not on the analog +12V/AGND. The residual is that its secondary return shares INTAN_GND
with those INA105s, coupled across 50 pF of barrier capacitance, and that it is PFM --
switching frequency varies with load, so the spectrum spreads rather than sitting at a
filterable tone. Reflected ripple is 80 mAp-p back into +5V, and EN 55032 class A is
claimed only WITH AN EXTERNAL FILTER. Treat input filtering and the INTAN_GND return
path as layout-stage requirements, not optional.

THE EXTERNAL FILTER IS DRAWN AS OF 2026-11-20 (layout task L1): C161, L1, C162 on
opto-intan.kicad_sch, to the emc_filter_* values above. Three things about it that a
reader of the values alone would not know:

  1. "SR0302" is a PACKAGE, not a part number Traco give in full. It is the 3.0 x 2.8 x
     2.5 mm unshielded drum outline. The Bourns SDR0302-4R7ML fitted is that outline at
     exactly the tabled 4.7 uH / 1.2 A (its Irms; its Isat is 1.35 A). It is an
     equivalent chosen here, not a part Traco name.

  2. C2 BRIDGES THE ISOLATION BARRIER, -Vin to -Vout: DGND to ISO_5V_RTN, which NT4 ties
     to INTAN_GND. That is how Traco draw it and why they rate it 2 kV against the
     converter's 1500 VDC. It takes the coupling between DGND and the Intan reference
     from about 110 pF to about 330 pF, roughly 3x: this converter's 50 pF max
     (isolation_capacitance_pf above) and the IH1215D's 60 pF max ([ih_series],
     isolation_capacitance_pf -- U2, primary on +12V/DGND, secondary on INTAN_GND) are
     already there, and C2 adds 220 pF. An earlier version of this note compared the
     220 pF with this converter's 50 pF alone, which understated the starting point.
     RULED 2026-11-20 (hardware/breakout/parametric-audit.md, R4): FITTED as published,
     and decided at bring-up -- measure Intan-input noise with C162 fitted and removed,
     keep the quieter.

  3. The pre-existing input capacitors C155 (10 uF) and C156 (100 nF) are still netted
     +5V/DGND, so they now sit on the SOURCE side of L1, in parallel with C1. Traco's
     figure has no capacitor between L1 and +Vin and none was added.

The datasheet at `url` was re-fetched on 2026-11-20 and is now "Rev. October 8, 2026",
not the 2019-10-07 revision this section was pinned from. Every value above the
emc_filter_* block, and the Pinout table (p.4), was compared against the new revision and
is unchanged; `revised` and `retrieved` are left as the record of what was first read."""

