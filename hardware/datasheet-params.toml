sync_topology = "primary/secondary: primary pin 4 (opto out) -> each secondary pin 2 (opto in), pin 5 opto-ground common"
applies_to_both_camera_groups = true   # see note -- ohDPI is a FLIR BFS rig too
feeds = ["camera-sync frame-time inputs"]
note = """Pinned 2026-08-16 for the free-running-camera change. Two facts drive the design.

ONE STROBE PER GROUP IS SUFFICIENT, and for a structural reason rather than an assumption:
in FLIR's multi-camera scheme the primary's strobe is what DRIVES the secondaries' trigger
inputs, so it does not merely represent the group's exposure, it defines it.

A STIFFER PULL-UP MAKES V_LOW WORSE, NOT BETTER. The table is not monotonic but its trend
is clear at the ends: 9.1 mA gives 1.46 V while 4.2 mA gives 0.87 V. So the intuitive fix
-- pull harder to get a cleaner low -- is exactly backwards, and 3.3 V/200 ohm is the worst
row in the table. The 200S6's page publishes nothing below 4.2 mA, so a lower-current
operating point is an EXTRAPOLATION, not a datasheet value, and this file does not hold
those. (The 16S2's page goes to 3.9 mA on the same row, at 0.92 V.)

THE 16S2'S LOADED HIGH IS BELOW THE FRAME-TIME THRESHOLD (2026-10-18). Its 5 V / 1.0 kohm
row gives 2.29 V high under "Load", against the frame-time comparator's 2.50 V. The page
does not define the load. This board's own input is close to none (1 kohm pull-up, 10 kohm
into a comparator), but the primary/secondary topology above has the primary's output
driving each secondary's opto input too, which is plausibly what "Load" means. Open, not
resolved here: see hardware/breakout/frame-time-inputs.md Sec.4.

0.87 V IS ABOVE EVERY TTL/LVC LOW-LEVEL INPUT THRESHOLD ON THIS BOARD (0.8 V max -- see
[sn74lvc541a] and [sn74ahct541]), so the strobe cannot land on a buffer input. It needs a
comparator with a chosen threshold, which is also the only option here whose margin is a
design choice rather than a datasheet coincidence.

FLIR's own opto-isolation means the camera side is ALREADY galvanically separated; pin 5
is the isolated emitter return. A second optocoupler on this board would be redundant.

THIS ENTRY COVERS BOTH CAMERA GROUPS, which was not obvious and is worth recording. The
eye tracker is OpenIrisDPI (Ressmeyer et al., a dual-Purkinje plugin for the OpenIris
framework), and OpenIris drives FLIR cameras through the Spinnaker SDK -- its reference
binocular build is two Blackfly S USB3 cameras at 720x540 and up to 500 fps, which is
exactly the 500 Hz spec Sec.6 already assumes for the eye channels. So the ohDPI strobe and
the behaviour-camera strobe are the SAME electrical interface, and one design serves both.

BFS also exposes a NON-isolated line at 3.3 V, which would avoid the threshold problem
entirely. It is not used here: taking it would tie this board's ground to the camera PC's,
and that is the ground loop ruling R2 was careful about for the eye-tracker D-sub -- the
camera rig is mains-powered equipment beside a Faraday-cage booth."""

