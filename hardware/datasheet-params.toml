# Datasheet parameters the breakout design depends on.
#
# WHY THIS FILE EXISTS
#
# Every value here was read from a manufacturer's primary document, not from a
# distributor listing or a search result. That distinction is load-bearing: during the
# 2026-08-15 parametric audit, distributor data was wrong about the MDR68's contact
# current rating (3 A listed, 0.5 A on the drawing) and an automated datasheet extraction
# was wrong about the OPAx197 on three of four values.
#
# The PDFs themselves are NOT committed. They are copyrighted vendor documents and this
# repository is public -- the Winchester drawing carries an explicit prohibition on
# reproduction. Facts are not copyrightable; the documents are. Keep local copies in a
# gitignored hardware/datasheets/ directory.
#
# HOW TO USE IT
#
#   import tomllib                                  # stdlib on Python 3.11+
#   p = tomllib.load(open("hardware/datasheet-params.toml", "rb"))
#   p["acsl_6xx0"]["i_fh_min_ma"]                   # -> 7.0
#
# Parametric checkers import limits from here rather than re-typing them, so a datasheet
# revision is a one-line change that propagates to every assertion.
#
# CONVENTIONS
#   *_min / *_max / *_typ   values as the datasheet states them
#   feeds                   audit findings (hardware/breakout/parametric-audit.md) that
#                           depend on this value
#   note                    a condition that changes how the number must be used

