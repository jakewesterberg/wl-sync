schema: 1
slug: wl-sync
class: device
lifecycle: active
visibility: public
remote: https://github.com/jakewesterberg/wl-sync.git

summary: >-
  The sync box and its breakout board: timing signals, event-code routing and
  signal conditioning for a recording rig. Owns session identity, the barcode
  codec and the log format.

status:
  phase: >-
    Software: the continuous recorder and the RP1 backend are built and wired
    into the run loop, and the backend has run on silicon (wl-rig-sync0, a CM5,
    2026-10-18). It binds piolib through a C shim, pio/wlsync_pio.c. A 30 s run
    with nothing wired recorded cleanly, with barcodes 1 s apart to within
    147 us. Session identity (one session per animal's visit, minted over HTTP
    by the box) is built and merged to main (2026-10-19); its
    tests run on a laptop against the fake backend, it has not been called from
    the task PC, and its MonkeyLogic recipe has never run under MATLAB. The capture paths are still unproven against
    real signals, so the systemd unit ships --fake. On 2026-10-30 one
    clock came to unwrap every delivery path and clock trust is judged at every
    roll (both deployed); headers gained process_uuid, barcode_delay_us and
    timebase, the box rolls once when NTP first syncs, a roll waits for records
    captured before it, the frame grid is placed again after a wall-clock step,
    edges that reach the kernel's buffer out of order are no longer reported
    lost, and an L record marks lost events in the segment (these on main, not
    deployed until wl-preproc's follow-up has merged). iter_records reads a
    segment one record at a time, so a long one need not fit in memory. Breakout board:
    schematic captured, layout not started. On 2026-11-07 the strobe-capture
    program was fixed. It lost 1.5 ticks per strobe and could leave its program
    when its counter wrapped. The fix counts 2:1 on every path, which is proven
    by simulating the program's words but not yet on silicon. One clock
    (docs/superpowers/specs/2026-10-30-one-clock-design.md), Part 1, is built,
    reviewed task by task and then as a whole branch, merged to main, and
    pushed (origin/main 29f6c37, 2026-11-20); it is not deployed. A
    second state machine stamps each barcode's lead edge, reading GPIO17
    itself with nothing wired (c-direct, bench spike S, 2026-11-07). Code
    words, barcodes and edges share RP1's PIO count, scaled by one rate per
    process: with a rate the box measured against NTP and kept in
    .wl-sync-pio-rate, ticks are SI us (timebase "rp1-pio-si"); with none,
    they count RP1's crystal ("rp1-pio"). A process whose stamp machine fails
    its start-up test records "split", as before. A frame whose lead edge is
    not stamped loses its B, with a journal ERROR. The header's schema is
    unchanged. The shim must be rebuilt (version 3). I1 (Task 1.15) is built,
    reviewed, its review's minors fixed, merged and pushed with main
    (2026-11-20; 1084 tests): a desynced stamp
    stream is paired again rather than stopped, and the journal says, once an
    episode, when the fit has gone 20 frames without a lead-edge pair, so
    that E and roll boundaries are extrapolated. Task 1.16 (the user's
    rulings, 2026-11-20) is built on branch one-clock-p1, reviewed, and its
    review's fixes made; not yet merged (1096 tests). It closes two gaps: a shim, PIO block or capture
    machine that cannot start no longer crash-loops the unit, and the
    process records split with no W records, saying so in the journal; and
    the start-up test enables its machine through the sync enable, so a box
    that refuses that call records split (C-7). A refusal of the production
    enable alone, after the test's was obeyed, is still not seen.
  next: >-
    Task 1.16's re-review, then its merge to main, wait. Note 7 goes to
    wl-preproc (docs/pending-wl-preproc-amendments.md), now with its line on
    split segments without W. I1 is pushed, not deployed; a fit lost
    beyond the restart's reach still drops every B
    until a restart, now with a WARNING. Three rulings of 2026-11-20 are
    still to be built: M2, the edge-order guard clamping
    edges silently ("count, summary only"); M4, a rate gate that never opens
    saying nothing ("one WARNING per process"); and Task 1.7's WARNING for
    each frame with stamps between frames ("edge-trigger it").
    Bench day, in the order of docs/next-session.md:112-177:
    rebuild the shim (version 3); then GPIO17 looped to GPIO20, so the box
    decodes its own barcode; then Task 5b Steps 3-5, whose first check is the
    fixed capture program on silicon (P0); then the session endpoint from the
    task PC and the MonkeyLogic checklist (docs/next-session.md). Leaving
    --fake also waits for bench B3a and B3b, on a harness not yet planned
    (docs/superpowers/plans/2026-11-07-one-clock.md:2004-2006). Once the unit
    runs the RP1 backend: run it 1 h, then restart it once, between sessions,
    so it applies a PIO rate (deploy/README.md). Before layout: the task PC
    line-out and the PFI copy of PD1_COMP (spec Sec.12 item 11).
  # The tip this block was written from. Quoted: an all-digit SHA would be
  # read by YAML as an integer.
  describes: "2cdb423"

runs_on: [rig/sync]
builds_on: [dws]

third_party:
  - name: python
    constraint: ">=3.11"
    why: The floor this project supports, and the one wl-preproc matches.
  - name: libgpiod
    constraint: ">=2"
    where: rig/sync
    why: >-
      v2 is required for the LineSettings/edge_detection API and for
      EdgeEvent.global_seqno and line_seqno, which are the only way a
      kernel-side edge drop is detectable, and together tell a buffer overflow
      from coalesced interrupts.
  - name: piolib
    where: rig/sync
    why: >-
      RP1's PIO API, from raspberrypi/utils. Its API is almost entirely static
      inline, so ctypes cannot call it: pio/build-shim.sh compiles its sources
      together with pio/wlsync_pio.c into libwlsync_pio.so on the box. Built and
      run on silicon against utils b57c48e (2026-10-16).
  - name: gcc
    where: rig/sync
    why: >-
      Builds libwlsync_pio.so on the box itself, because piolib's headers are
      Linux-only and its API static inline, so there is no prebuilt library to
      install.
  - name: systemd-timesyncd
    where: rig/sync
    why: >-
      The box's NTP client must be timesyncd. The PIO rate that scales one
      count's ticks to SI us is measured only over clock pairs taken while the
      kernel reports an outstanding NTP offset of at most 1 ms (and its PLL on),
      which keeps the first sync's slew out of the estimate. That check assumes
      a client that corrects the clock through the kernel's PLL; a builder
      check found that under chrony the offset stays 0, unverified on the box,
      so large slews would pass it (one-clock spec Sec.2.2, ruling OC-R1;
      docs/superpowers/specs/2026-10-30-one-clock-design.md:268-272;
      wl_sync/calibration.py:89-98). That timesyncd sets the PLL flag is itself
      unverified until bench B7 logs it, and without it no pair passes and no
      rate file is ever written (deploy/README.md, "Before first boot").
  - name: kicad
    where: dws
    why: The breakout board's schematic and layout.

# What the sync box owns. wl-preproc's CHECKPOINT states the direction: "wl-sync
# owns everything the sync box produces — session identity, the barcode codec,
# the log format — and wl-preproc depends on it via a direct git reference."
# None of these ships as a rendered schema here; the JSON form of the log header
# exists only as wl-preproc's re-export, which is why that entry is a mirror
# there and the definition is here.
publishes:
  - name: syncbox-log-header
    kind: pydantic-model
    at: wl_sync/log.py
    stability: stable
    what: >-
      The header on every sync box log: schema_version, session_id, rig,
      boot_id, written_at, the gpio_map, the segment index and ordering,
      whether the clock was trusted with the reason if not, the id of the
      process that wrote it, and the measured barcode delay. wl-preproc
      re-exports it to docs/schemas/syncbox_log_header.json rather than
      redefining it, and its CI diffs that export so a drift here fails there.

  - name: session-id
    kind: pydantic-model
    at: wl_sync/session.py
    stability: stable
    what: >-
      Session identity as the sync box mints it. Everything downstream keys on
      this, so a change to its form renames every session in the lab.

  - name: barcode-codec
    kind: pydantic-model
    at: wl_sync/barcode.py
    stability: stable
    what: >-
      The barcode the sync box emits and everything else decodes to align
      streams onto one clock. The codec is the contract; a change breaks
      alignment for any recording made across the boundary.

  - name: session-endpoint
    kind: http-api
    at: wl_sync/endpoint.py
    stability: provisional
    what: >-
      GET /session reads the open session; POST /session/open and /session/close
      (bearer token) open and close one per animal's visit. The task PC and
      MonkeyLogic call it; the box is the only thing that mints a session id.
