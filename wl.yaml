schema: 1
slug: wl-sync
class: device
lifecycle: active
visibility: public
remote: https://github.com/jakewesterberg/wl-sync.git

summary: >-
  The sync box and its breakout board: timing signals, event-code routing and
  signal conditioning for a recording rig. Owns session identity, the barcode
  codec and the log format.

status:
  phase: >-
    Software: the continuous recorder and the RP1 backend are built and wired
    into the run loop, and the backend has run on silicon (wl-sync-rig0, a CM5,
    2026-10-18). It binds piolib through a C shim, pio/wlsync_pio.c. A 30 s run
    with nothing wired recorded cleanly, with barcodes 1 s apart to within
    147 us. Session identity (one session per animal's visit, minted over HTTP
    by the box) is built and merged to main (2026-10-19); its
    tests run on a laptop against the fake backend, it has not been called from
    the task PC, and its MonkeyLogic recipe has never run under MATLAB. The capture paths are still unproven against
    real signals, so the systemd unit ships --fake. 410 tests. Breakout board:
    schematic captured, layout not started.
  next: >-
    Bench day with signals on the pins: first GPIO17
    looped to GPIO20, so the box decodes its own barcode; then Task 5b
    Steps 3-5, the session endpoint from the task PC, and the MonkeyLogic
    checklist (docs/next-session.md). Before layout: the task PC line-out and
    the PFI copy of PD1_COMP (spec Sec.12 item 11).
  # The tip this block was written from. Quoted: an all-digit SHA would be
  # read by YAML as an integer.
  describes: "0920921"

runs_on: [rig/sync]
builds_on: [dws]

third_party:
  - name: python
    constraint: ">=3.11"
    why: The floor this project supports, and the one wl-preproc matches.
  - name: libgpiod
    constraint: ">=2"
    where: rig/sync
    why: >-
      v2 is required for the LineSettings/edge_detection API and for
      EdgeEvent.global_seqno, which is the only way a kernel-side edge drop is
      detectable.
  - name: piolib
    where: rig/sync
    why: >-
      RP1's PIO API, from raspberrypi/utils. Its API is almost entirely static
      inline, so ctypes cannot call it: pio/build-shim.sh compiles its sources
      together with pio/wlsync_pio.c into libwlsync_pio.so on the box. Built and
      run on silicon against utils b57c48e (2026-10-16).
  - name: gcc
    where: rig/sync
    why: >-
      Builds libwlsync_pio.so on the box itself, because piolib's headers are
      Linux-only and its API static inline, so there is no prebuilt library to
      install.
  - name: kicad
    where: dws
    why: The breakout board's schematic and layout.

# What the sync box owns. wl-preproc's CHECKPOINT states the direction: "wl-sync
# owns everything the sync box produces — session identity, the barcode codec,
# the log format — and wl-preproc depends on it via a direct git reference."
# None of these ships as a rendered schema here; the JSON form of the log header
# exists only as wl-preproc's re-export, which is why that entry is a mirror
# there and the definition is here.
publishes:
  - name: syncbox-log-header
    kind: pydantic-model
    at: wl_sync/log.py
    stability: stable
    what: >-
      The header on every sync box log: schema_version, session_id, rig,
      boot_id, written_at, the gpio_map, the segment index and ordering, and
      whether the clock was trusted with the reason if not. wl-preproc
      re-exports it to docs/schemas/syncbox_log_header.json rather than
      redefining it, and its CI diffs that export so a drift here fails there.

  - name: session-id
    kind: pydantic-model
    at: wl_sync/session.py
    stability: stable
    what: >-
      Session identity as the sync box mints it. Everything downstream keys on
      this, so a change to its form renames every session in the lab.

  - name: barcode-codec
    kind: pydantic-model
    at: wl_sync/barcode.py
    stability: stable
    what: >-
      The barcode the sync box emits and everything else decodes to align
      streams onto one clock. The codec is the contract; a change breaks
      alignment for any recording made across the boundary.

  - name: session-endpoint
    kind: http-api
    at: wl_sync/endpoint.py
    stability: provisional
    what: >-
      GET /session reads the open session; POST /session/open and /session/close
      (bearer token) open and close one per animal's visit. The task PC and
      MonkeyLogic call it; the box is the only thing that mints a session id.
